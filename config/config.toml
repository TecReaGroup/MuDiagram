[storage]
# Directory holding one folder per project (relative to the repository root)
project_root = "./backend/data/project"
# JSON file holding the folder list (relative to the repository root)
folder_file = "./backend/data/folder/folder.json"

[trash]
# Days a deleted project stays in the trash before it is purged permanently
retention_days = 7

[ui]
# Options: "zh-CN" | "en-US"
language = "zh-CN"

[ai]
# Any OpenAI-compatible Chat Completions endpoint (OpenAI, DeepSeek, OpenRouter, Ollama, ...)
model = "claude-sonnet-5-5"
# Leave empty to use the official OpenAI endpoint
base_url = ""
# Name of the environment variable that holds the API key
api_key_env = "AI_API_KEY"
