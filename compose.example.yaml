services:
  mudiagram:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/log:/app/backend/data/log
      - ./backend/data/project:/app/backend/data/project
      - ./backend/data/folder:/app/backend/data/folder
      - ./backend/data/setting:/app/backend/data/setting
      - ./config:/app/config:ro
    environment:
      NODE_ENV: production

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mudiagram-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: <your_tunnel_token>
    depends_on:
      - mudiagram
