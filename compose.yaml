services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/log:/app/backend/data/log
      - ./backend/data/project:/app/backend/data/project
      - ./config:/app/config:ro
    environment:
      NODE_ENV: production
      PORT: 8787
      AI_API_KEY: ${AI_API_KEY:-}
