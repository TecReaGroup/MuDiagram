services:
  mudiagram:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data/log:/app/backend/data/log
      - ./backend/data/project:/app/backend/data/project
      - ./backend/data/setting:/app/backend/data/setting
      - ./config:/app/config:ro
    environment:
      NODE_ENV: production

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mudiagram-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      # Read from .env; set the tunnel's public hostname service to http://mudiagram:8787 in the Zero Trust dashboard.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      - mudiagram
